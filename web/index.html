<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>OJ 刷题助手</title>
    <meta name="description" content="可嵌入 iframe 的算法刷题助手，浏览器内运行开源大模型" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app" class="app">
      <!-- 登录页：行内表单，不使用弹窗 -->
      <section id="login" class="login" hidden>
        <form id="loginForm" class="login-card">
          <div class="logo">AI</div>
          <h1 id="loginTitle">OJ 刷题助手</h1>
          <p class="muted">请输入站点访问口令</p>
          <input id="password" type="password" autocomplete="current-password" placeholder="访问口令" required />
          <button id="loginBtn" type="submit" class="btn primary block">登录</button>
          <p id="loginError" class="error" role="alert"></p>
        </form>
      </section>

      <div id="main" class="main" hidden>
        <aside id="sidebar" class="sidebar">
          <div class="brand">
            <span class="logo">AI</span>
            <span id="brandName" class="brand-name">OJ 刷题助手</span>
          </div>
          <button id="newChatBtn" type="button" class="btn primary block">+ 新建会话</button>
          <nav id="sessionList" class="session-list" data-session-list aria-label="历史会话"></nav>
          <div class="sidebar-foot">
            <button id="clearAllBtn" type="button" class="btn ghost small">清空全部</button>
            <select id="modelSelect" class="model-select" hidden aria-label="选择模型"></select>
            <span id="modelLabel" class="muted small"></span>
          </div>
        </aside>

        <section class="chat">
          <header class="chat-head">
            <button id="historyBtn" type="button" class="btn ghost small history-toggle" aria-expanded="false">历史</button>
            <span id="chatTitle" class="chat-title"></span>
            <select id="presetSelect" class="model-select preset-select" aria-label="对话预设" title="对话预设（按浏览器保存）" hidden></select>
            <button id="imageModeBtn" type="button" class="btn ghost small" aria-pressed="false" title="切换到生图模式：会先释放聊天模型的显存" hidden>生图</button>
            <button id="embedNewBtn" type="button" class="btn ghost small">新会话</button>
            <button id="exportChatBtn" type="button" class="btn ghost small" title="把当前对话保存为 Markdown 文件（仅保存在本机，不上传）">导出对话</button>
            <span id="roleBadge" class="role-badge" title="当前权限">访客</span>
            <button id="roleBtn" type="button" class="btn ghost small" aria-expanded="false">更改权限</button>
            <div id="historyPanel" class="history-panel" hidden>
              <div class="history-list" data-session-list></div>
            </div>
            <div id="rolePanel" class="history-panel role-panel" hidden>
              <p id="roleStatus" class="role-status"></p>
              <form id="roleForm" class="role-form">
                <input id="adminKey" type="password" autocomplete="off" placeholder="管理员密钥" aria-label="管理员密钥" />
                <button id="roleSubmit" type="submit" class="btn primary small">验证并升级</button>
                <p id="roleError" class="error small" role="alert"></p>
              </form>
              <button id="roleLogoutBtn" type="button" class="btn ghost small" hidden>退出管理员</button>
              <div id="paramOverrides" class="param-overrides" hidden></div>
              <div class="role-section">
                <p id="modelAdminHint" class="muted small"></p>
                <div class="model-tools">
                  <button id="exportModelBtn" type="button" class="btn ghost small" title="把当前模型（需已下载）导出为 .ojmodel 文件">导出当前模型</button>
                  <button id="importModelBtn" type="button" class="btn ghost small" title="导入 .ojmodel 文件，成为“新建 AI”">导入模型文件</button>
                  <button id="importTrainBtn" type="button" class="btn ghost small" title="导入外部训练得到的 .ojmodel，成为“新建 AI”">导入训练结果</button>
                  <input id="importModelInput" type="file" accept=".ojmodel" hidden />
                  <input id="importTrainInput" type="file" accept=".ojmodel" hidden />
                </div>
                <label class="export-params" id="exportParamsLabel">
                  <input id="exportWithParams" type="checkbox" checked />
                  <span id="exportParamsText"></span>
                </label>
                <div id="localModelList" class="local-list"></div>
                <div class="site-tools">
                  <button id="downloadSiteBtn" type="button" class="btn ghost small" title="下载网站源码与构建产物（不含任何 AI 模型）">下载网站包</button>
                </div>
                <div class="data-export">
                  <p class="muted small">导出本机数据（仅保存在你的电脑上，不上传；文件可能包含对话内容）：</p>
                  <div id="dataSectionList" class="data-section-list"></div>
                  <button id="exportDataBtn" type="button" class="btn ghost small">导出所选数据</button>
                </div>
                <div class="role-section">
                  <p id="adaptHint" class="muted small"></p>
                  <div id="migrateBox" class="local-list" hidden></div>
                  <div id="adaptList" class="local-list"></div>
                </div>
              </div>
            </div>
          </header>

          <div id="messages" class="messages" role="log" aria-live="polite"></div>

          <div id="statusBar" class="status-bar" role="status" hidden>
            <div class="status-text" id="statusText"></div>
            <div class="progress" id="statusProgress" hidden><i id="statusBarFill"></i></div>
          </div>

          <section id="imagePanel" class="image-panel" aria-label="生图" hidden>
            <div class="image-controls">
              <label class="image-field">模型 <select id="imageModelSelect" class="model-select"></select></label>
              <label class="image-field">比例 <select id="imageRatio">
                <option value="custom">自定义</option>
                <option value="1:1">1:1</option>
                <option value="4:3">4:3</option>
                <option value="3:4">3:4</option>
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
              </select></label>
              <label class="image-field">宽 <input id="imageWidth" type="number" min="256" max="768" step="8" /></label>
              <label class="image-field">高 <input id="imageHeight" type="number" min="256" max="768" step="8" /></label>
              <label class="image-field">步数 <input id="imageSteps" type="number" min="2" max="50" step="1" /></label>
              <label class="image-field">引导 <input id="imageGuidance" type="number" min="1" max="20" step="0.5" /></label>
              <label class="image-field">种子 <input id="imageSeed" type="number" min="0" max="4294967295" placeholder="留空随机" /></label>
            </div>
            <p id="imageEffective" class="muted small"></p>
            <div id="imageModelFiles" class="image-files" hidden>
              <span id="imageFilesStatus" class="muted small" role="status"></span>
              <div class="image-admin-row">
                <button id="imageDownloadBtn" type="button" class="btn ghost small" title="把该模型的全部文件保存到本机浏览器（之后可离线生成）">下载到本机</button>
                <button id="imageExportModelBtn" type="button" class="btn ghost small" title="把本机已下载的模型导出为 .ojimage 文件，供其他设备导入">导出 .ojimage</button>
                <label class="btn ghost small image-file-label" title="导入之前导出的 .ojimage 文件（必须与本站配置的模型一致）">导入 .ojimage<input id="imageImportModelInput" type="file" accept=".ojimage" hidden /></label>
                <button id="imageDeleteFilesBtn" type="button" class="btn ghost small" title="删除本机缓存的模型文件，释放磁盘空间">删除本机文件</button>
              </div>
              <div id="imageDownloadProgress" class="progress" hidden><i id="imageDownloadFill"></i></div>
            </div>
            <form id="imageForm" class="image-composer">
              <textarea id="imagePrompt" rows="2" placeholder="描述想要的画面（英文通常效果更好）。Enter 生成，Shift+Enter 换行"></textarea>
              <button id="imageGenerateBtn" type="submit" class="btn primary">生成</button>
              <button id="imageCancelBtn" type="button" class="btn danger" hidden>取消</button>
            </form>
            <p id="imageStatus" class="muted small" role="status"></p>
            <div id="imageProgress" class="progress" hidden><i id="imageProgressFill"></i></div>
            <div class="image-admin-row image-gallery-tools">
              <span id="imageGalleryCount" class="muted small"></span>
              <button id="imageExportGalleryBtn" type="button" class="btn ghost small" title="把画廊中的全部图片与提示词导出为 zip">导出画廊（zip）</button>
              <label class="btn ghost small image-file-label" title="导入之前导出的画廊 zip（重复的图片会跳过）">导入画廊（zip）<input id="imageImportGalleryInput" type="file" accept=".zip,application/zip" hidden /></label>
              <button id="imageClearGalleryBtn" type="button" class="btn ghost small">清空画廊</button>
            </div>
            <div id="imageGallery" class="image-gallery"></div>
            <div id="imageAdmin" class="image-admin" hidden>
              <p class="muted small">管理员：在提示词中单独写一行“参数：width=768, height=512, steps=25, guidance=6, seed=42”即可记录生图参数（仅本机，直到清除）。下方的风格提示会附加到每次生图的提示词末尾；CLIP 只读取前 77 个 token。</p>
              <div class="image-admin-row">
                <input id="imageHintInput" type="text" placeholder="风格提示，例如：水彩风格，柔和光线" aria-label="风格提示" />
                <button id="imageHintAdd" type="button" class="btn ghost small">添加风格提示</button>
                <button id="imageParamsClear" type="button" class="btn ghost small">清除管理员生图参数</button>
              </div>
              <div id="imageHintList" class="local-list"></div>
            </div>
          </section>

          <form id="composer" class="composer">
            <textarea id="input" rows="1" placeholder="描述题目或粘贴代码。Enter 发送，Shift+Enter 换行"></textarea>
            <label id="thinkToggleLabel" class="think-toggle" title="仅推理模型：开启后先展示思考过程（可折叠）；关闭后直接给出回答，速度更快" hidden>
              <input id="thinkToggle" type="checkbox" checked />
              <span>思考模式</span>
            </label>
            <label id="slidingToggleLabel" class="think-toggle" title="开启后上下文固定为滑动窗口大小（默认 4096），超出的最早历史滚出窗口，管理员信息始终保留；关闭则沿用上下文窗口与历史条数、字数限制">
              <input id="slidingToggle" type="checkbox" />
              <span>滑动窗口</span>
            </label>
            <button id="undoBtn" type="button" class="btn ghost small" title="撤回上一轮：删除最后一问一答，问题放回输入框（不会发送）" hidden>撤回</button>
            <button id="sendBtn" type="submit" class="btn primary">发送</button>
            <button id="stopBtn" type="button" class="btn danger" hidden>停止</button>
          </form>
        </section>
      </div>
    </div>
    <dialog id="markDialog" class="correction-dialog mark-dialog" aria-labelledby="markTitle">
      <form id="markForm" class="correction-form">
        <h3 id="markTitle">标记错误说法</h3>
        <p id="markDesc" class="muted small"></p>
        <label class="small muted" for="markWrong">错误的说法（可从回复中选取后打开）</label>
        <textarea id="markWrong" rows="2" aria-label="错误的说法"></textarea>
        <label class="small muted" for="markRight">正确的说法（会同时作为该 AI 的更正）</label>
        <textarea id="markRight" rows="3" aria-label="正确的说法"></textarea>
        <input id="markKey" type="password" autocomplete="off" placeholder="管理员密钥" aria-label="管理员密钥" />
        <p id="markError" class="error small" role="alert"></p>
        <div class="correction-actions">
          <button id="markCancel" type="button" class="btn ghost small">取消</button>
          <button id="markSubmit" type="submit" class="btn primary small">验证并记录</button>
        </div>
      </form>
    </dialog>
    <dialog id="correctionDialog" class="correction-dialog" aria-labelledby="correctionTitle">
      <form id="correctionForm" class="correction-form">
        <h3 id="correctionTitle">管理员验证</h3>
        <p id="correctionDesc" class="muted small">这条消息包含更正。输入管理员密钥验证后，才会作为该 AI 的底层设定记录（仅本机）；取消则不发送。</p>
        <pre id="correctionPreview" class="correction-preview"></pre>
        <input id="correctionKey" type="password" autocomplete="off" placeholder="管理员密钥" aria-label="管理员密钥" />
        <p id="correctionError" class="error small" role="alert"></p>
        <div class="correction-actions">
          <button id="correctionCancel" type="button" class="btn ghost small">取消</button>
          <button id="correctionSubmit" type="submit" class="btn primary small">验证并发送</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
