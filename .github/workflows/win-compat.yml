# Windows 兼容性验证：在真实 Windows 环境里解析并执行启动脚本。
#
# 沙箱/开发机是 Linux，没有 PowerShell，本地测试只能做静态检查（括号配平、BOM、
# 换行符）。但"语法看起来对"和"PS 5.1 真的能解析、能执行"是两件事——PS 5.1 不支持
# ??、?.、ForEach-Object -Parallel 等新语法，静态检查看不出来。
#
# 这个工作流已经抓到过一个静态检查完全查不出的真 bug：
#   check-env.ps1 里删掉 if 分支时留下孤立的 elseif，PowerShell 报
#   "The term 'elseif' is not recognized"，而括号计数是配平的。
name: Windows compat

on:
  push:
    branches: ['arena/**', main]
    paths:
      - 'scripts/launcher/**'
      - 'scripts/launcher-server/**'
      - 'scripts/pack-*.mjs'
      - 'scripts/site-files.mjs'
      - 'web/index.html'
      - 'test/windows-legacy-compat.test.js'
      - '.github/workflows/win-compat.yml'
  pull_request:
    paths:
      - 'scripts/launcher/**'
      - 'scripts/launcher-server/**'

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 用 Windows 自带的 PowerShell 5.1（shell: powershell，不是 pwsh）做语法解析。
      # Parser::ParseFile 会把所有语法错误收集到 $errors，比直接执行更严格也更早。
      - name: PowerShell 5.1 语法解析
        shell: powershell
        run: |
          $bad = 0
          $files = @(
            'scripts\launcher\check-env.ps1',
            'scripts\launcher\serve-api.ps1',
            'scripts\launcher\serve-site.ps1',
            'scripts\launcher-server\serve-server.ps1'
          )
          foreach ($f in $files) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f).Path, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "FAIL $f"
              foreach ($e in $errors) {
                Write-Host ("  line {0}: {1}" -f $e.Extent.StartLineNumber, $e.Message)
              }
              $bad++
            } else {
              Write-Host "OK   $f"
            }
          }
          if ($bad -gt 0) { exit 1 }

      # 真正执行一遍：dot-source 之后取版本信息、调一次环境检查。
      # 分步骤做（而不是塞在一个大脚本里 + $ErrorActionPreference='Stop'），
      # 失败时能一眼看出是哪一段，也避免非终止错误被 Stop 放大成整步失败。
      # 注意：这一步的 Write-Host/throw 文案**必须用英文**。
      # Windows PowerShell 5.1 在 GitHub Actions 的控制台下输出中文会直接失败
      # （代码页不匹配，报 WriteError），与本项目脚本无关——已实测确认：
      # 同样的脚本，输出英文成功、输出中文失败。脚本自身面向用户的中文保持不变。
      - name: 执行 check-env.ps1 并校验版本识别
        shell: powershell
        run: |
          . .\scripts\launcher\check-env.ps1
          $w = Get-OjWindowsInfo
          Write-Host "runner: name=[$($w.Name)] release=[$($w.Release)] build=$($w.Build)"
          if ($w.Build -lt 10240) { throw "unexpected runner build: $($w.Build)" }
          if ($w.Name -ne 'Windows 10' -and $w.Name -ne 'Windows 11') { throw "version detect failed: $($w.Name)" }
          # Windows 11 的 release 应为空（Name 已含），否则会显示 "Windows 11 Windows 11"
          if ($w.Name -eq 'Windows 11' -and $w.Release -ne '') {
            throw "Win11 release should be empty, got [$($w.Release)]"
          }
          Write-Host 'version detection ok'

      - name: 受支持系统上不得阻塞启动
        shell: powershell
        run: |
          . .\scripts\launcher\check-env.ps1
          $ok = Test-OjEnvironment
          Write-Host "Test-OjEnvironment => [$ok]"
          if ($ok -ne $true) { throw 'Test-OjEnvironment returned false on a supported system' }

      - name: 打包白名单包含 check-env.ps1
        shell: bash
        run: |
          node -e "import('./scripts/site-files.mjs').then(m=>{const n=m.LAUNCHER_FILES.map(f=>f.from);if(!n.includes('check-env.ps1')){console.error('LAUNCHER_FILES 缺少 check-env.ps1');process.exit(1)}console.log('白名单 OK:',n.join(', '))})"
