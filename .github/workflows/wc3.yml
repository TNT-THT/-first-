name: WC3
on:
  push:
    branches: ['arena/**']
permissions:
  contents: write
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: p
        shell: powershell
        run: |
          . .\scripts\launcher\check-env.ps1
          $o = @()
          $w = Get-OjWindowsInfo
          $o += "NAME=$($w.Name) REL=$($w.Release) B=$($w.Build)"
          try { $r = Test-OjEnvironment; $o += "RET=$r TYPE=$($r.GetType().Name)" }
          catch { $o += "THROW=$($_.Exception.Message) LINE=$($_.InvocationInfo.ScriptLineNumber)" }
          $o | Out-File -Encoding utf8 r.txt
      - if: always()
        shell: bash
        run: |
          git config user.email a@b.c; git config user.name ci
          git checkout -b "wc3-${{ github.run_id }}" 2>/dev/null || true
          git add -f r.txt; git commit -m r || true
          git push origin "HEAD:wc3-${{ github.run_id }}" --force
