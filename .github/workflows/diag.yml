# 临时诊断：本地跑不出来的 CI 失败，把 npm test 的输出回写成提交评论，便于从 API 读取。
# 定位问题后请删除本文件。
name: Diag

on:
  push:
    branches:
      - 'arena/ae546e15-sky-blue1-0'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test with captured output
        run: |
          set +e
          node --version
          grep -E 'MemTotal|MemAvailable|CommitLimit|SwapTotal' /proc/meminfo || true
          nproc
          npm test > test.log 2>&1
          echo "exit=$?" >> test.log
          tail -c 200000 test.log > tail.log
          wc -l test.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: test.log
          if-no-files-found: warn
      - name: Publish failure detail as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            let t = "";
            for (const f of ["tail.log", "test.log"]) {
              try { t = fs.readFileSync(f, "utf8"); if (t) break; } catch {}
            }
            if (!t) t = "(没有读到 test.log)";
            fs.writeFileSync("body.json", JSON.stringify({ body: "### CI 测试输出\n\n```\n" + t.slice(-55000) + "\n```" }));
            console.log("body bytes:", fs.statSync("body.json").size);
          '
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input body.json --jq '.id'
