# 临时诊断：本地跑不出来的 CI 失败，把 npm test 的输出回写成提交评论，便于从 API 读取。
# 定位问题后请删除本文件。
name: Diag

on:
  push:
    branches:
      - 'arena/ae546e15-sky-blue1-0'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test with captured output
        run: |
          set +e
          node --version
          grep -E 'MemTotal|MemAvailable|CommitLimit|SwapTotal' /proc/meminfo || true
          nproc
          npm test > test.log 2>&1
          echo "exit=$?" >> test.log
          tail -c 200000 test.log > tail.log
          wc -l test.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: test.log
          if-no-files-found: warn
      - name: Publish failure detail as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            let t = "";
            try { t = fs.readFileSync("test.log", "utf8"); } catch {}
            if (!t) { fs.writeFileSync("body.json", JSON.stringify({ body: "没有读到 test.log" })); process.exit(0); }
            const lines = t.split("\n");
            const keep = [];
            for (let i = 0; i < lines.length; i++) {
              if (/^not ok /.test(lines[i])) {
                // 失败用例：名字 + 紧随其后的 20 行（含 error 块）
                keep.push("", "---", lines[i]);
                for (let j = 1; j <= 22 && i + j < lines.length; j++) keep.push(lines[i + j]);
              }
              if (/^# (tests|pass|fail|cancelled)/.test(lines[i])) keep.push(lines[i]);
              if (/^exit=/.test(lines[i])) keep.push(lines[i]);
              if (/^(MemTotal|MemAvailable|CommitLimit|SwapTotal|\d+$)/.test(lines[i])) keep.push("[env] " + lines[i]);
            }
            const body = "### CI 测试摘要（仅失败项）\n\n```\n" + keep.join("\n").slice(0, 55000) + "\n```";
            fs.writeFileSync("body.json", JSON.stringify({ body }));
            console.log("fail lines:", keep.length);
          '
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input body.json --jq '.id'
