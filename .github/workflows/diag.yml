name: Diag
on:
  push:
    branches: ['arena/**']
permissions:
  contents: write
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run standalone exactly like release, capture error
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node standalone/build-standalone.mjs --with-llama *>&1 | Tee-Object -FilePath out.log
          $code = $LASTEXITCODE
          Add-Content out.log "`n=== EXITCODE=$code ==="
          $raw = Get-Content out.log -Raw
          if ($null -eq $raw) { $raw = "(empty)" }
          $fence = [char]96 + [char]96 + [char]96
          $text = "### release 同款命令 exit=$code`n`n$fence`n" + $raw + "`n$fence"
          [System.IO.File]::WriteAllText("$PWD\body.json", (@{ body = $text } | ConvertTo-Json -Compress))
          try { gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input body.json } catch { Write-Output "comment failed" }
          exit $code
