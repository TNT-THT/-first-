name: Diag
on:
  push:
    branches: ['arena/**']
permissions:
  contents: write
  pull-requests: write
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reproduce standalone --with-llama
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node standalone/build-standalone.mjs --with-llama *>&1 | Out-File -Encoding utf8 out.log
          $code = $LASTEXITCODE
          Add-Content out.log "`n=== EXITCODE=$code ==="
          $raw = Get-Content out.log -Raw
          if ($null -eq $raw) { $raw = "(empty)" }
          $fence = [char]96 + [char]96 + [char]96
          $text = "### Windows standalone 复现 exit=$code`n`n$fence`n" + $raw + "`n$fence"
          $json = @{ body = $text } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText("$PWD\body.json", $json)
          try { gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input body.json } catch { Write-Output "comment failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            out.log
            body.json
