name: Diag
on:
  push:
    branches: ['arena/ae546e15-sky-blue1-0']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test
        run: |
          set +e
          npm test > test.log 2>&1
          echo "exit=$?" >> test.log
        continue-on-error: true
      - name: Comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            let t = "";
            try { t = fs.readFileSync("test.log", "utf8"); } catch {}
            if (!t) { fs.writeFileSync("body.json", JSON.stringify({ body: "no log" })); process.exit(0); }
            const lines = t.split("\n");
            const keep = [];
            for (let i = 0; i < lines.length; i++) {
              if (/^not ok /.test(lines[i])) {
                keep.push("", "---", lines[i]);
                for (let j = 1; j <= 25 && i + j < lines.length; j++) keep.push(lines[i + j]);
              }
              if (/^# (tests|pass|fail|cancelled)/.test(lines[i])) keep.push(lines[i]);
              if (/^exit=/.test(lines[i])) keep.push(lines[i]);
            }
            fs.writeFileSync("body.json", JSON.stringify({ body: "### CI 失败项\n\n```\n" + keep.join("\n").slice(0, 55000) + "\n```" }));
          '
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input body.json --jq '.id'
