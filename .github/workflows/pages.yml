# 构建纯静态版本（浏览器内运行 WebLLM 开源模型）并发布到 GitHub Pages。
# 无需服务器、无需 API Key。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, arena/64ed15eb-first]
  # GITHUB_TOKEN 提交不会再次触发 push 工作流；索引刷新成功后由此事件重新构建 Pages。
  workflow_run:
    workflows: ["Refresh Chinese research index"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # workflow_run 只在资料索引刷新成功时部署，避免失败的抓取任务触发无意义发布。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
