name: WC6
on:
  push:
    branches: ['arena/**']
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: A_bare
        shell: powershell
        run: |
          . .\scripts\launcher\check-env.ps1
          $w = Get-OjWindowsInfo
          Write-Host "runner: name=[$($w.Name)] release=[$($w.Release)] build=$($w.Build)"
          if ($w.Build -lt 10240) { throw "bad build" }
          if ($w.Name -ne 'Windows 10' -and $w.Name -ne 'Windows 11') { throw "bad name" }
          if ($w.Name -eq 'Windows 11' -and $w.Release -ne '') { throw "rel=[$($w.Release)]" }
          Write-Host 'version ok'
      - name: B_chinese_writehost
        shell: powershell
        run: |
          $PSDefaultParameterValues['Out-File:Encoding'] = 'utf8'
          Write-Host '中文输出测试'
          $w = Get-OjWindowsInfo
          Write-Host "版本：$($w.Name)"
      - name: C_throw_chinese
        shell: powershell
        run: |
          throw "中文错误信息测试"
        continue-on-error: true
      - name: D_console_encoding
        shell: powershell
        run: |
          Write-Host "OutputEncoding=[$([Console]::OutputEncoding.WebName)]"
          Write-Host "chcp:"
          chcp
