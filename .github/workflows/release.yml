# 在可联网环境构建带内置 Node 运行时的四平台网站包与一站式训练包，并发布到 GitHub Release。
# 本地与沙箱环境拿不到各平台的官方 Node 二进制，因此正式发布统一走这里：
# 给仓库打 v* 标签（如 v1.0.0）推送，或在 Actions 页面手动运行并填写版本号。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 先构建再测试：部分用例需要 web/dist 存在（与 Pages 工作流顺序一致）
      # 构建静态版网页，并按平台打包网站包（每个包只含对应平台的一个内置 Node 运行时）
      - run: npm run build
      - run: npm test
      - run: npm run test:training
      # 一站式训练包（training/ 的脚本、模型清单与示例）
      - run: node scripts/pack-training.mjs
      # 局域网服务器包（Windows）：一台电脑运行模型，局域网用户用浏览器远程使用
      - run: node scripts/pack-server.mjs
      # 校验模型下载清单与当前模型记录一致（清单已提交在 docs/model-downloads.md）
      - run: node scripts/model-links.mjs
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: |
            ## 独立软件：LLM托管平台——天蓝色1.0（推荐，尤其想跑大模型时）

            - `LLM托管平台-天蓝色1.0.exe`：Windows 单文件版，双击即用，不需要预装任何东西。
            - `LLM托管平台-天蓝色1.0.zip`：完整压缩包（exe + 解压版程序 + llama.cpp 运行库 + 使用说明）。

            功能与网站包一致（网页小模型、OpenAI 兼容 API、管理员面板、用量统计），另外内置 llama.cpp 本机大模型引擎：可下载并运行 Qwen3.8-27B、Qwen3-32B、Llama-3.3-70B、Llama-4-Scout-109B、Qwen3-235B、Llama-3.1-405B、DeepSeek-R1-671B 等 27B～671B 级开源大模型。大模型权重不含在安装包内，首次使用时在软件里按需下载（请先确认内存足够）。

            ## 网站包（按你的电脑四选一，不要全部下载）

            - Windows：`site-win-x64.zip`
            - Mac（Apple 芯片）：`site-darwin-arm64.zip`
            - Mac（Intel 芯片）：`site-darwin-x64.zip`
            - Linux：`site-linux-x64.zip`

            每个包都包含网页与本机 API 服务（含对应平台的内置 Node 运行时），解压后双击里面的启动文件即可使用，不需要预装 Node.js，也不用敲命令。网站包同样支持上面的本机大模型（在“API 接入 → 本机大模型”中下载运行库与权重）。
            网站包不包含任何 AI 模型：网页小模型在首次选用时自动下载并缓存，全部 39 个模型的权重与运行库下载地址见仓库的 `docs/model-downloads.md`。

            ## 局域网服务器版（Windows，一台电脑供多人共用）

            - `server-win-x64.zip`：解压到服务器电脑上双击 `start-server.bat` 即可。服务器在本地运行模型，同一个局域网里的其他人用浏览器打开窗口里显示的地址（如 `http://192.168.1.10:3000/`）就能聊天，计算都在服务器上完成。普通使用免登录；注册账号后，对话记录与个人设定按账号存在服务器上，模型大家共用。先只提供 Windows 版。

            ## 一站式训练包

            - `oj-training.zip`：在有显卡的电脑上自己微调模型。解压后按包内 `training/README.md` 操作：`pip install -r training/requirements.txt`，再运行 `python3 training/ojtrain.py models` 查看可训练模型。

            网页上的下载按钮默认指向最新版 Release；如需锁定版本，可在 `web/public/config.json` 的 `release.tag` 中填写本版本号。
          files: |
            web/dist/site-win-x64.zip
            web/dist/site-darwin-arm64.zip
            web/dist/site-darwin-x64.zip
            web/dist/site-linux-x64.zip
            web/dist/server-win-x64.zip
            release-assets/oj-training.zip
          fail_on_unmatched_files: true
          make_latest: true

  # 独立软件在 Windows 上构建单文件 exe（Node SEA 需要目标平台的 Node 二进制），
  # 并组装完整压缩包（含 llama.cpp 官方 Windows 构建），追加到同一个 Release。
  standalone:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 失败时把真实错误写进 Release 说明，否则日志拿不到（存储策略阻止下载日志），
      # 只能看到“exit code 1”这一句，排查等于瞎猜。
      - name: Build standalone
        shell: pwsh
        run: |
          node standalone/build-standalone.mjs --with-llama *>&1 | Tee-Object -FilePath standalone-error.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $raw = Get-Content standalone-error.log -Raw
            if (-not $raw) { $raw = "(no output)" }
            $body = @{
              tag_name = "${{ inputs.tag || github.ref_name }}"
              body = "> [standalone build failed, exit=$code]`n`n$raw"
            } | ConvertTo-Json -Compress -Depth 5
            [System.IO.File]::WriteAllText("$PWDail.json", $body)
            try { gh api -X PATCH "repos/${{ github.repository }}/releases/tags/${{ inputs.tag || github.ref_name }}" --input fail.json } catch { Write-Output "upload failed" }
            exit $code
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            release-assets/standalone/LLM托管平台-天蓝色1.0.exe
            release-assets/standalone/LLM托管平台-天蓝色1.0.zip
          fail_on_unmatched_files: true
