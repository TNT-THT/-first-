name: WinCompat2
on:
  push:
    branches: ['arena/**']
permissions:
  contents: write
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        shell: powershell
        run: |
          $out = @()
          try {
            . .\scripts\launcher\check-env.ps1
            $out += "DOTSOURCE_OK"
          } catch {
            $out += "DOTSOURCE_FAIL: $($_.Exception.Message)"
            $out += "AT: $($_.InvocationInfo.ScriptName):$($_.InvocationInfo.ScriptLineNumber)"
          }
          if (Get-Command Get-OjWindowsInfo -ErrorAction SilentlyContinue) {
            $out += "FUNC_EXISTS"
            try { $w = Get-OjWindowsInfo; $out += "INFO=$($w.Name)|$($w.Release)|$($w.Build)" }
            catch { $out += "INFO_FAIL: $($_.Exception.Message) AT $($_.InvocationInfo.ScriptLineNumber)" }
          } else { $out += "FUNC_MISSING" }
          $out | Out-File -Encoding utf8 probe-result.txt
      - name: push result
        if: always()
        shell: bash
        run: |
          git config user.email "ci@example.com"; git config user.name "ci"
          git checkout -b "ci-probe-${{ github.run_id }}" 2>/dev/null || true
          git add -f probe-result.txt
          git commit -m "probe" || echo none
          git push origin "HEAD:ci-probe-${{ github.run_id }}" --force
