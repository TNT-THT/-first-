name: WinCompat2
on:
  push:
    branches: ['arena/**']
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: dump
        shell: powershell
        run: |
          . .\scripts\launcher\check-env.ps1
          $w = Get-OjWindowsInfo
          $lines = @()
          $lines += "OSVERSION=$([System.Environment]::OSVersion.Version)"
          $lines += "NAME=$($w.Name) RELEASE=$($w.Release) BUILD=$($w.Build)"
          $r = $null
          $err = 'none'
          try { $r = Test-OjEnvironment } catch { $err = $_.Exception.Message }
          $lines += "RETURN=$r"
          $lines += "ERR=$err"
          $lines | Out-File -Encoding utf8 result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: result.txt
