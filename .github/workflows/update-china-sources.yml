# 只使用 GitHub Actions 生成中国资料 RSS/Atom 静态索引。
# 浏览器运行时只读取同一 GitHub Pages 站点的 JSON，不代理用户查询，也不需要 API Key。
name: Refresh Chinese research index

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: china-research-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    # 定时任务只会在默认分支执行；手动触发时也允许维护者在功能分支验证来源。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test index parser without network access
        run: python3 test/test_update_china_sources.py
      - name: Fetch configured RSS and Atom summaries
        run: python3 scripts/update_china_sources.py --config data/china-feeds.json --output web/public/data/china-sources.json
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- web/public/data/china-sources.json; then
            echo "No index changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/china-sources.json
          git commit -m "chore(data): refresh Chinese research index"
          git push
