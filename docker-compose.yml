services:
  oj-ai:
    build: .
    env_file: .env
    volumes:
      # 同时持久化网站生成的 API Key 摘要与管理员控制台的服务端参数设置。
      - api-keys-data:/app/data
    ports:
      - "127.0.0.1:3000:3000"   # 只监听本机，由 Nginx/Caddy 对外提供 HTTPS
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 连接宿主机上的 Ollama/vLLM 时使用
    restart: unless-stopped

  # 可选：在同一台服务器上运行 Ollama，实现完全自托管（不依赖外部 AI API）。
  # 将 .env 中 LLM_BASE_URL=http://ollama:11434/v1、LLM_MODEL=<已下载的模型名> 后启动：
  #   docker compose --profile local-llm up -d --build
  # 首次使用需在本机导入/下载模型；模型权重保存在 ollama-models 卷中。
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped

volumes:
  api-keys-data:
  ollama-models:
